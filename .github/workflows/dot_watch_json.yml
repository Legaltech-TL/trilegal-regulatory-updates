name: DOT Watcher

on:
  schedule:
    - cron: '45 2 * * *'  # 08:15 IST
    - cron: '45 5 * * *'  # 11:15 IST
    - cron: '45 8 * * *'  # 14:15 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dot-watcher
  cancel-in-progress: false


jobs:
  run-dot-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true


      - name: Ensure main branch exists and checkout main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin +refs/heads/*:refs/remotes/origin/* || true
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
              git reset --hard origin/main
            else
              git checkout -b main origin/main
            fi
          else
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
            else
              git checkout -b main
            fi
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
          fi


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ---------- PLAYWRIGHT SETUP ----------

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright


      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps


      # ---------- RUN SCRAPER (HEADFUL HIDDEN) ----------

      - name: Run DOT scraper
        run: |
          if [ -f "./dot_watcher.py" ]; then
            xvfb-run -a python ./dot_watcher.py
          else
            echo "ERROR: dot_watcher.py not found"
            ls -la
            exit 1
          fi


      # ---------- COMMIT OUTPUT ----------

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      
          git add -A
      
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
      
          git commit -m "Auto-update from DOT Watcher [CI]"
      
          # FIX: pull latest remote changes first
          git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
      
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
