name: RBI FAQ Watcher

on:
  schedule:
    - cron: '30 3,7,11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regulatory-updates
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests lxml python-dateutil

      - name: Run scraper
        run: python rbi_faq_scraper.py

      - name: Commit if changed
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"

          git add data/*.csv data/*.json || true
          git diff --cached --quiet || git commit -m "RBI FAQ: new entries added [CI]"
          git push || true
