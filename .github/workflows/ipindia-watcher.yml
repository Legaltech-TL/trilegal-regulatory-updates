name: IPIndia Watcher

on:
  schedule:
    - cron: '10 4 * * *'   # 09:40 IST
    - cron: '10 8 * * *'   # 13:40 IST
    - cron: '0 12 * * *'   # 17:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipindia-watcher
  cancel-in-progress: false


jobs:
  run-ipindia-watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true


      - name: Ensure main branch exists and checkout main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin +refs/heads/*:refs/remotes/origin/* || true
          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
              git reset --hard origin/main
            else
              git checkout -b main origin/main
            fi
          else
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
            else
              git checkout -b main
            fi
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
          fi


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas lxml python-dateutil


      - name: Run IP India scraper
        run: |
          if [ -f "./ipindia.py" ]; then
            python ./ipindia.py
          else
            echo "ERROR: ipindia.py not found"
            ls -la
            exit 1
          fi


      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update from IPIndia Watcher [CI]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
